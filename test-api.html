<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reelssaver API Test</title><style>body{font-family:Arial,sans-serif;background:#f6f3fb;color:#171525;margin:0;padding:24px}.card{max-width:680px;margin:auto;background:#fff;border:1px solid #e4deed;border-radius:20px;padding:22px;box-shadow:0 12px 35px #39265b12}h1{margin:0 0 8px}p{color:#696378}input,button{box-sizing:border-box;width:100%;padding:13px 15px;border-radius:12px;font-size:15px}input{border:1px solid #d9d2e3;margin:12px 0}button{border:0;color:#fff;background:linear-gradient(90deg,#7557ff,#d33be5);font-weight:700;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#16131e;color:#dfffe7;padding:14px;border-radius:12px;min-height:80px;margin-top:15px}.warn{font-size:12px;color:#8a6100;background:#fff8d8;padding:10px;border-radius:10px}</style></head><body><main class="card"><h1>Reelssaver API Test</h1><p>Apna ya permitted public Instagram Reel/Post URL paste karein.</p><div class="warn">Session cookie sirf backend ki .env file mein honi chahiye. Is page mein cookie paste na karein.</div><input id="url" placeholder="https://www.instagram.com/reel/..."><button onclick="testApi()">Resolve media</button><pre id="output">Ready.</pre></main><script>async function testApi(){const o=document.getElementById('output'),url=document.getElementById('url').value.trim();o.textContent='Loading...';try{const r=await fetch('/api/instagram/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,videoQuality:'max'})});const j=await r.json();o.textContent=JSON.stringify(j,null,2);if(r.ok&&j.result?.url){const a=document.createElement('a');a.href=j.result.url;a.textContent='Open download URL';a.target='_blank';a.style.cssText='display:block;margin-top:12px';o.after(a)}}catch(e){o.textContent='Error: '+e.message}}</script></body></html>
